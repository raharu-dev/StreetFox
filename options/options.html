<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StreetFox Settings</title>
  <link rel="stylesheet" href="../shared/settings.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" width="44" height="44" alt="StreetFox logo">
    <div>
      <h1>StreetFox</h1>
      <p class="sub">Street View 360° panorama downloader</p>
    </div>
  </header>

  <main id="settings-root">
    <p class="loading">Loading settings…</p>

  <footer>
    <p>While viewing Street View in Google Maps, use the download button next to the map controls,

  </footer>

  <script src="../shared/config.js"></script>
  <script src="../shared/settings-panel.js"></script>
  <script src="options.js"></script>
</body>
</html>
